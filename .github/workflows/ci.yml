name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Install R packages
        run: |
          install.packages("randomForest")
          install.packages("iml")
        shell: Rscript {0}

      - name: Run test script
        run: Rscript test_rf_iml.R

      - name: Rename prediction result file
        run: |
          mv prediction_result.csv prediction_result-${{ matrix.os }}.csv
        shell: bash

      - name: Upload prediction results
        uses: actions/upload-artifact@v4
        with:
          name: prediction_result-${{ matrix.os }}
          path: prediction_result-${{ matrix.os }}.csv
